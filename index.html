<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Brisca</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>La Brisca</h1>

<section id="pantalla-inicio">
  <button id="btn-jugar">Jugar</button>
</section>

<section id="pantalla-juego" class="oculta">
  <div class="marcador">
    <span>Tú: <span id="puntos-jugador">0</span></span>
    <span>Máquina: <span id="puntos-maquina">0</span></span>
  </div>

  <div class="mesa">
    <div class="mano-maquina" id="mano-maquina"></div>

    <div class="zona-central">
      <div class="zona-mazo">
        <span id="mazo-contador">0</span> cartas
      </div>
      <div class="zona-jugadas">
        <div id="carta-jugada-maquina" class="slot-carta"></div>
        <div id="carta-jugada-jugador" class="slot-carta"></div>
      </div>
      <div class="zona-triunfo">
        Triunfo: <span id="triunfo"></span>
      </div>
    </div>

    <div class="mano-jugador" id="mano-jugador"></div>
  </div>

  <p id="mensaje"></p>
</section>

<section id="pantalla-fin" class="oculta">
  <h2 id="fin-titulo"></h2>
  <p id="fin-detalle"></p>
  <button id="btn-jugar-de-nuevo">Jugar de nuevo</button>
</section>

<script src="js/game.js"></script>
</body>
</html>
